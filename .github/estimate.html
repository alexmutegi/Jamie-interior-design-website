<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instant Estimate | Jamie Design</title>
<meta name="description" content="Get an instant price estimate for gypsum ceilings, painting, lighting and decor. Receive a PDF breakdown by email or WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="estimate">
<main>
<section class="pagehead"><div class="wrap"><h1>Instant estimate</h1><p class="lead">Enter your room size and what you need. Get an approximate price in seconds, with a PDF breakdown.</p></div></section>
<section style="border:0"><div class="wrap qgrid est">
<form id="est" novalidate>
  <fieldset><legend>Your details</legend>
    <div class="two"><label>Name<input name="name" required autocomplete="name"></label><label>Mobile number<input name="phone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="0712 345 678"></label></div>
    <label>Email (we send your PDF here)<input name="email" type="email" required autocomplete="email"></label>
    <label>Location (area or estate)<input name="loc" required></label>
    <input name="company" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  </fieldset>
  <fieldset><legend>Room size (metres)</legend>
    <div class="three"><label>Length<input name="len" type="number" step="0.1" min="1" value="4" required inputmode="decimal"></label><label>Width<input name="wid" type="number" step="0.1" min="1" value="4" required inputmode="decimal"></label><label>Height<input name="hei" type="number" step="0.1" min="2" value="2.8" required inputmode="decimal"></label></div>
    <label>Number of similar rooms<input name="rooms" type="number" min="1" value="1" inputmode="numeric"></label>
  </fieldset>
  <fieldset><legend>What do you need?</legend>
    <label class="chk"><input type="checkbox" name="s_ceiling" checked> Gypsum ceiling</label>
    <label>Ceiling style<select name="style"><option value="flat">Flat</option><option value="stepped" selected>Stepped with cove lighting</option><option value="curved">Curved or custom</option></select></label>
    <label class="chk"><input type="checkbox" name="s_light"> Lighting design and installation</label>
    <label>Light points per room<input name="pts" type="number" min="0" value="6" inputmode="numeric"></label>
    <label class="chk"><input type="checkbox" name="s_paint"> Painting (walls and ceiling)</label>
    <label class="chk"><input type="checkbox" name="s_trim"> Cornice and skirting finishing</label>
    <label class="chk"><input type="checkbox" name="s_decor"> Decor artwork and accessories</label>
    <label class="chk"><input type="checkbox" name="s_curtain"> Curtains</label>
    <label>Number of windows<input name="win" type="number" min="0" value="2" inputmode="numeric"></label>
    <label class="chk"><input type="checkbox" name="s_colour"> Colour selection consultation</label>
    <label class="chk"><input type="checkbox" name="s_plan"> Space planning</label>
    <label class="chk"><input type="checkbox" name="s_concept"> Design concept (mood board and 3D)</label>
  </fieldset>
  <fieldset><legend>Finish level</legend>
    <label class="chk"><input type="radio" name="fin" value="standard" checked> Standard: budget friendly</label>
    <label class="chk"><input type="radio" name="fin" value="premium"> Premium: better materials and detail</label>
    <label class="chk"><input type="radio" name="fin" value="luxury"> Luxury: top-end materials and custom work</label>
  </fieldset>
  <button class="btn" type="submit">Get my instant estimate</button>
  <div id="err" role="alert" style="color:var(--pink)"></div>
</form>
<div id="res" class="res" hidden></div>
</div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script src="site.js"></script>
<script src="quote.js"></script>
</body>
</html>
